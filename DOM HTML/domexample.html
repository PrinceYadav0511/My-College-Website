<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2 id="heading">Hello Student</h2>

    <button onclick="changText()">Click Me</button>

    <script>

        function changText()
        {
            document.getElementById("heading").innerHTML = "Welcome to Javascript DOM!";
        }
    </script>
    
</body>
</html>
