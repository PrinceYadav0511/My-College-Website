<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let mark=Number (prompt("enter your mark"));

        if(mark>=90)
        {
            document.write("Grade A+");
        
        }
        else if (mark>=60){
        
            document.write("Grade A");
        }

        else if(mark>=40){
        
             document.write("Grade B");
        }
        else{
        
          document.write("fail");   
        }

    </script>
    
</body>
</html>
