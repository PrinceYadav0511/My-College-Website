<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <link rel="stylesheet" href="form.css">
</head>

<body>

    <div class="container">

        <h1>STUDENT REGISTER FORM</h1>

        <form method="post" action="thanks.html">

            <fieldset>
                <legend>PERSONAL INFORMATION</legend>

                <label>Name:</label>
                <input type="text" placeholder="Enter your name" autofocus>

                <label>Father Name:</label>
                <input type="text" placeholder="Enter your father's name">

                <label>Mother Name:</label>
                <input type="text" placeholder="Enter your mother's name">

                <label>Gender:</label>
                <div class="radio">
                    Male <input type="radio" name="Gender">
                    Female <input type="radio" name="Gender">
                </div>

                <label>Password:</label>
                <input type="password" placeholder="Enter your password" required>

                <label>Date Of Birth:</label>
                <input type="date" name="DOB">

                <label>Hobbies:</label>
                <div class="checkbox">
                    <label><input type="checkbox" name="Hobbies"> Football</label>
                    <label><input type="checkbox" name="Hobbies"> Cricket</label>
                    <label><input type="checkbox" name="Hobbies"> Chess</label>
                    <label><input type="checkbox" name="Hobbies"> Basketball</label>
                </div>

                <label>Semester:</label>
                <select name="Semester">
                    <option>1st</option>
                    <option>2nd</option>
                    <option>3rd</option>
                    <option>4th</option>
                    <option>5th</option>
                    <option>6th</option>
                </select>

                <label>Email:</label>
                <input type="email" placeholder="Enter your email">

                <label>Address:</label>
                <textarea placeholder="Enter your address"></textarea>

                <label>Browse:</label>
                <input type="file" accept="image/*, audio/*, video/*">

                <div class="buttons">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>

            </fieldset>

        </form>

    </div>

</body>
</html>
