<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px;
            background-color: aquamarine;
            width: 250px;
            height: 250px;
        }
    </style>
</head>
<body>
    <h1>CALCULATION</h1>

    <script>

        function add()
        {
            var n1 = parseInt(document.getElementById("num1").value);
              var n2 = parseInt(document.getElementById("num2").value);
              var sum=n1+n2;
              document.getElementById("demo").innerHTML="Addition of "+n1+ " + " +n2+ " is = "+sum;

        }

         function sub()
        {
            var n1 = parseInt(document.getElementById("num1").value);
              var n2 = parseInt(document.getElementById("num2").value);
              var sub=n1-n2;
              document.getElementById("demo").innerHTML="subtraction of "+n1+ " - " +n2+ " is = "+sub;
              
        }

         function mul()
        {
            var n1 = parseInt(document.getElementById("num1").value);
              var n2 = parseInt(document.getElementById("num2").value);
              var mul=n1*n2;
              document.getElementById("demo").innerHTML="muitiply of "+n1+ " * " +n2+ " is = "+mul;
              
        }

         function division()
        {
            var n1 = parseInt(document.getElementById("num1").value);
              var n2 = parseInt(document.getElementById("num2").value);
              var division=n1/n2;
              document.getElementById("demo").innerHTML="division of "+n1+ " / " +n2+ " is = "+division;
              
        }
    </script>
    <div class="container">

        <input type="text" autofocus placeholder="Enter the first number" name="number" id="num1"><br><br>
                <input type="text" autofocus placeholder="Enter the second number" name="number" id="num2"><br><br>

        <button type="button" onclick="add()">ADD</button><br><br>
         <button type="button" onclick="sub()">SUB</button><br><br>
          <button type="button" onclick="mul()">MUL</button><br><br>
           <button type="button" onclick="division()">DIV</button><br>
         <p id="demo"></p>
        </div>

    
</body>
</html>
