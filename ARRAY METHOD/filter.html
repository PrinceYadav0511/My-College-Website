<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>

        let age=[10, 20, 6, 8, 18 ];

        document.write(age + "<br><br>");

        let b=age.filter(checkAdult);

        document.write(b + "<br><br>");
        
        function checkAdult(a)
        {
            return a>=18;
        }
        
    </script>
    
</body>
</html>
